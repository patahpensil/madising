name: MADISING CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Foundation API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: npm run check:syntax
      - name: Run API tests
        run: npm test

  flutter-check:
    name: Flutter static analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run widget tests
        run: flutter test

  policy-check:
    name: Locked requirements recorded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify governance baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIDRAP-LOCK' docs/DECISIONS.md
          grep -q 'ACCOUNT-LOCK' docs/DECISIONS.md
          grep -q 'STAFF-LOCK' docs/DECISIONS.md
          grep -q 'VENDOR-MAINTENANCE' docs/DECISIONS.md


  database-migration:
    name: PostgreSQL identity schema and constraints
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madising_ci
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: madising_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madising_ci -d madising_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if unavailable
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply migration (synthetic CI database only)
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U madising_ci -d madising_ci \
            -v ON_ERROR_STOP=1 -f infra/postgres/migrations/001_identity_authz.sql
          psql -X -h 127.0.0.1 -U madising_ci -d madising_ci \
            -v ON_ERROR_STOP=1 -f infra/postgres/migrations/001_identity_authz.sql
      - name: Verify database negative security constraints
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U madising_ci -d madising_ci \
            -v ON_ERROR_STOP=1 -f infra/postgres/tests/001_identity_authz_smoke.sql

  repository-hygiene:
    name: Reject tracked credentials and patient exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect tracked file paths
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(secrets|patient-exports|clinical-uploads)(/|$)|(^|/)\.env($|[./])|\.(pem|p8|key|keystore|jks)$'; then
            echo 'Forbidden secret or clinical-export path is tracked.'
            exit 1
          fi
      - name: Detect recognizable credentials in tracked text
        shell: bash
        run: |
          set -euo pipefail
          # This heuristic is defense in depth, not a substitute for dedicated scanning.
          if git grep -I -n -E -e '-----BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{16,}' -- .; then
            echo 'Recognizable credential-like content is tracked.'
            exit 1
          fi
