name: MADISING CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Foundation API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: npm run check:syntax
      - name: Run API tests
        run: npm test

  flutter-check:
    name: Flutter static analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run widget tests
        run: flutter test

  policy-check:
    name: Locked requirements recorded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify governance baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIDRAP-LOCK' docs/DECISIONS.md
          grep -q 'ACCOUNT-LOCK' docs/DECISIONS.md
          grep -q 'STAFF-LOCK' docs/DECISIONS.md
          grep -q 'VENDOR-MAINTENANCE' docs/DECISIONS.md


  database-migration:
    name: PostgreSQL identity schema and constraints
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madising_ci
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: madising_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madising_ci -d madising_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if unavailable
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply migration (synthetic CI database only)
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U madising_ci -d madising_ci \
            -v ON_ERROR_STOP=1 -f infra/postgres/migrations/001_identity_authz.sql
          psql -X -h 127.0.0.1 -U madising_ci -d madising_ci \
            -v ON_ERROR_STOP=1 -f infra/postgres/migrations/001_identity_authz.sql
      - name: Verify database negative security constraints
        shell: bash
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U madising_ci -d madising_ci \
            -v ON_ERROR_STOP=1 -f infra/postgres/tests/001_identity_authz_smoke.sql

  repository-hygiene:
    name: Reject tracked credentials and patient exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect tracked file paths
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(secrets|patient-exports|clinical-uploads)(/|$)|(^|/)\.env($|[./])|\.(pem|p8|key|keystore|jks)$'; then
            echo 'Forbidden secret or clinical-export path is tracked.'
            exit 1
          fi
      - name: Detect recognizable credentials in tracked text
        shell: bash
        run: |
          set -euo pipefail
          # This heuristic is defense in depth, not a substitute for dedicated scanning.
          if git grep -I -n -E -e '-----BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{16,}' -- .; then
            echo 'Recognizable credential-like content is tracked.'
            exit 1
          fi

  staging-stack:
    name: NestJS Next.js PostgreSQL synthetic integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trial_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: trial_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trial_ci -d trial_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRIAL_DATABASE_URL: postgresql://trial_ci:synthetic-ci-only@127.0.0.1:5432/trial_ci
      NEXT_TELEMETRY_DISABLED: '1'
      WHATSAPP_OTP_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate disposable OTP pepper
        shell: bash
        run: |
          pepper=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")
          echo "::add-mask::$pepper"
          printf 'OTP_PEPPER=%s\n' "$pepper" >> "$GITHUB_ENV"
      - name: Apply isolated trial migration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql "$TRIAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/postgres/trial/001_sessions.sql
          psql "$TRIAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/postgres/trial/002_role_tokens.sql
          psql "$TRIAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/postgres/trial/003_accounts.sql
          psql "$TRIAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/postgres/trial/004_access.sql
          psql "$TRIAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/postgres/trial/004_access.sql
      - name: Install and verify API
        run: |
          npm --prefix apps/staging-api ci --no-audit --no-fund
          npm --prefix apps/staging-api run build
          npm --prefix apps/staging-api test
      - name: Build Next.js
        run: |
          npm --prefix apps/staging-web ci --no-audit --no-fund
          npm --prefix apps/staging-web run build
      - name: Audit production dependencies
        run: |
          npm --prefix apps/staging-api audit --omit=dev
          npm --prefix apps/staging-web audit --omit=dev
      - name: Verify HTTP boundary
        shell: bash
        run: |
          set -euo pipefail
          MADISING_TRIAL_ENABLED=1 MADISING_FIXTURE_HARNESS=1 MADISING_ACCOUNT_TRIAL=1 node apps/staging-api/dist/main.js > /tmp/madising-api.log 2>&1 &
          api=$!
          trap 'kill "$api" 2>/dev/null || true; wait "$api" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/readyz
          curl -fsS -X POST http://127.0.0.1:3001/trial/sessions -H 'Content-Type: application/json' -d '{}' > /tmp/madising-session.json
          node -e 'const s=require("/tmp/madising-session.json");if(s.state.status!=="DRAFT"||s.state.version!==0||!s.tokens.PAT)process.exit(1)'

      - name: Install browser test runner
        run: |
          npm --prefix apps/staging-web install --no-save --package-lock=false playwright
          cd apps/staging-web
          npx playwright install --with-deps chromium
      - name: Verify Next.js to NestJS end-to-end HTTP and browser
        shell: bash
        run: |
          set -euo pipefail
          MADISING_TRIAL_ENABLED=1 MADISING_FIXTURE_HARNESS=1 MADISING_ACCOUNT_TRIAL=1 node apps/staging-api/dist/main.js > /tmp/trial-api.log 2>&1 &
          api=$!
          (cd apps/staging-web && MADISING_TRIAL_ENABLED=1 MADISING_FIXTURE_HARNESS=1 MADISING_ACCOUNT_TRIAL=1 TRIAL_WEB_ORIGIN=http://127.0.0.1:3000 node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000) > /tmp/trial-web.log 2>&1 &
          web=$!
          trap 'kill "$api" "$web" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/readyz && curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node apps/staging-web/test/http-flow.mjs
          node apps/staging-web/test/browser-flow.mjs
          node apps/staging-web/test/preview-flow.mjs
          node apps/staging-web/test/account-flow.mjs
      - name: Verify WhatsApp OTP, passkeys, onboarding, settings and care team in Chromium
        shell: bash
        run: |
          set -euo pipefail
          # WebAuthn rejects IP-address relying parties, so this run uses the localhost origin.
          export MADISING_TRIAL_ENABLED=1 MADISING_FIXTURE_HARNESS=1 MADISING_ACCOUNT_TRIAL=1 WEBAUTHN_RP_ID=localhost TRIAL_WEB_ORIGIN=http://localhost:3000
          for i in {1..20}; do ss -ltn | grep -qE ':(3000|3001) ' || break; sleep 1; done
          node apps/staging-api/dist/main.js > /tmp/access-api.log 2>&1 &
          api=$!
          (cd apps/staging-web && node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000) > /tmp/access-web.log 2>&1 &
          web=$!
          trap 'kill "$api" "$web" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/readyz && curl -fsS http://localhost:3000/account > /dev/null; then break; fi
            sleep 1
          done
          SCREENSHOT_DIR=/tmp/access-screens node apps/staging-web/test/access-flow.mjs
          SCREENSHOT_DIR=/tmp/access-screens node apps/staging-web/test/independent-access-http.mjs
          node apps/staging-web/test/independent-passkeys.mjs
      - name: Keep access flow screenshots for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: access-flow-screenshots
          path: /tmp/access-screens
          if-no-files-found: ignore

  public-static-preview:
    name: Verify published static preview after merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm --prefix apps/staging-web ci --no-audit --no-fund
          npm --prefix apps/staging-web install --no-save --package-lock=false playwright
          cd apps/staging-web
          npx playwright install --with-deps chromium
      - name: Verify exact published HTML, noindex, synthetic banner and browser journey
        env:
          PREVIEW_URL: https://madising.patahpensilsimulasi.workers.dev
          PREVIEW_SCREENSHOT_DIR: /tmp/public-preview-screens
        run: node apps/staging-web/test/preview-flow.mjs
      - name: Retain public preview screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-preview-screenshots
          path: /tmp/public-preview-screens
          if-no-files-found: ignore
